<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>BlynAI — OG kortelė 1200×630</title>
<!-- Source of assets/og-card.png — the approved variant (2a) of the designer's
     OG handoff, rebuilt on the repo's own tokens and self-hosted fonts so the
     copy can be edited here. Regenerate the PNG with:  node tools/render.mjs
     The shipped assets/og-card.png is the designer's render; rerunning the tool
     replaces it with a render of this file. -->
<link rel="stylesheet" href="../ds/styles.css">
<style>
html,body{margin:0;background:var(--paper-200)}
.og{width:1200px;height:630px;position:relative;overflow:hidden;display:flex;flex-direction:column;
  background:var(--wash-gold),var(--wash-violet),var(--paper-000)}
.og-rule{height:8px;flex:none;background:var(--gradient-rule)}
.og-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 64px 0}
.og-lockup{display:flex;align-items:center;gap:36px}
.og-plate{width:158px;height:158px;flex:none;display:grid;place-items:center;border-radius:36px;
  background:var(--ink-900);border:1px solid var(--border-gold);
  box-shadow:var(--shadow-mark),0 0 54px rgba(245,184,79,.22)}
.og-plate img{display:block;width:114px;height:114px}
.og-word{display:inline-flex;flex-direction:column;align-items:flex-start;gap:12px}
.og-word b{font:var(--fw-semibold) 116px/1 var(--font-display);letter-spacing:-.02em;
  white-space:nowrap;color:var(--text-heading)}
.og-word b i{font-style:normal;color:var(--gold-700)}
.og-word small{font:500 34px var(--font-mono);text-transform:uppercase;letter-spacing:.18em;
  color:var(--violet-700)}
.og-tagline{margin-top:42px;font:var(--fw-regular) 48px/1.22 var(--font-display);color:var(--text-heading)}
.og-domain{margin-top:18px;align-self:flex-end;font:500 30px var(--font-mono);
  letter-spacing:.16em;text-transform:uppercase;color:var(--text-heading)}
.og-curve{display:block;width:100%;height:110px;flex:none}
</style>
</head>
<body>
<div class="og">
  <div class="og-rule"></div>
  <div class="og-body">
    <div class="og-lockup">
      <span class="og-plate"><img src="../assets/logo-mark.svg" alt=""></span>
      <span class="og-word">
        <b>Blyn<i>AI</i> Systems</b>
        <small>L&amp;D Finance Lab</small>
      </span>
    </div>
    <p class="og-tagline">Kripto finansų sistemos,<br><span class="blyn-grad">patikrintos gyvoje rinkoje.</span></p>
    <p class="og-domain">blynai.eu</p>
  </div>
  <svg class="og-curve" viewBox="0 0 1200 190" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="og-line" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#F5B84F"/><stop offset=".55" stop-color="#C98F63"/><stop offset="1" stop-color="#6B4EDB"/></linearGradient>
      <linearGradient id="og-fill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(245,184,79,.22)"/><stop offset="1" stop-color="rgba(107,78,219,.18)"/></linearGradient>
    </defs>
    <path d="M0 150 L100 140 L190 156 L290 120 L380 134 L480 96 L570 112 L670 72 L760 88 L860 50 L950 66 L1060 26 L1130 40 L1200 8 L1200 190 L0 190 Z" fill="url(#og-fill)"/>
    <path d="M0 150 L100 140 L190 156 L290 120 L380 134 L480 96 L570 112 L670 72 L760 88 L860 50 L950 66 L1060 26 L1130 40 L1200 8" fill="none" stroke="url(#og-line)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>
</div>
</body>
</html>

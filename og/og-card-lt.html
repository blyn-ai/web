<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>BlynAI Systems — OG kortelė (LT)</title>
<!-- Source of assets/og-card-lt.png — the designer's
     card rebuilt on the repo's own tokens and self-hosted fonts, so the copy
     stays editable. Regenerate both PNGs with:  node tools/render.mjs -->
<link rel="stylesheet" href="../ds/styles.css">
<style>
html,body{margin:0;background:var(--paper-200)}
.ogc{width:1200px;height:630px;position:relative;overflow:hidden;display:flex;flex-direction:column;
  background:var(--wash-gold),var(--wash-violet),var(--paper-000)}
.ogc-rule{height:8px;flex:none;background:var(--gradient-rule)}
.ogc-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 64px 0}
.ogc-lock{display:flex;align-items:center;gap:36px}
.ogc-plate{width:158px;height:158px;flex:none;display:grid;place-items:center;border-radius:36px;
  background:var(--ink-900);border:1px solid var(--border-gold);box-shadow:var(--shadow-mark)}
.ogc-plate img{display:block;width:114px;height:114px}
.ogc-wm{display:inline-flex;flex-direction:column;align-items:stretch;gap:12px}
.ogc-wm b{font:var(--fw-semibold) 116px/1 var(--font-display);letter-spacing:-.02em;
  white-space:nowrap;color:var(--text-heading)}
.ogc-wm b i{font-style:normal;color:var(--gold-700)}
/* Sub-line justified across the wordmark's width; the two empty <i> open the word gaps. */
.ogc-wm small{display:flex;justify-content:space-between;font:500 34px var(--font-mono);
  text-transform:uppercase;color:var(--violet-700)}
.ogc-wm small i{flex:0 0 .5em}
.ogc-tag{margin-top:42px;font:var(--fw-regular) 48px/1.22 var(--font-display);color:var(--text-heading)}
.ogc-url{margin-top:18px;align-self:flex-end;font:500 30px var(--font-mono);
  letter-spacing:.16em;text-transform:uppercase;color:var(--text-heading)}
.ogc-curve{display:block;width:100%;height:110px;flex:none}
</style>
</head>
<body>
<div class="ogc">
  <div class="ogc-rule"></div>
  <div class="ogc-body">
    <div class="ogc-lock">
      <span class="ogc-plate"><img src="../assets/logo-mark.svg" alt=""></span>
      <span class="ogc-wm">
        <b>Blyn<i>AI</i> Systems</b>
        <small><span>L</span><span>&amp;</span><span>D</span><i></i><span>F</span><span>I</span><span>N</span><span>A</span><span>N</span><span>C</span><span>E</span><i></i><span>L</span><span>A</span><span>B</span></small>
      </span>
    </div>
    <p class="ogc-tag">Finansų sistemos,<br><span class="blyn-grad">patikrintos gyvose rinkose.</span></p>
    <p class="ogc-url">blynai.eu</p>
  </div>
  <svg class="ogc-curve" viewBox="0 0 1200 190" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="ogl-lt" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#F5B84F"/><stop offset=".55" stop-color="#C98F63"/><stop offset="1" stop-color="#6B4EDB"/></linearGradient>
      <linearGradient id="ogf-lt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(245,184,79,.22)"/><stop offset="1" stop-color="rgba(107,78,219,.18)"/></linearGradient>
    </defs>
    <path d="M0 150 L100 140 L190 156 L290 120 L380 134 L480 96 L570 112 L670 72 L760 88 L860 50 L950 66 L1060 26 L1130 40 L1200 8 L1200 190 L0 190 Z" fill="url(#ogf-lt)"/>
    <path d="M0 150 L100 140 L190 156 L290 120 L380 134 L480 96 L570 112 L670 72 L760 88 L860 50 L950 66 L1060 26 L1130 40 L1200 8" fill="none" stroke="url(#ogl-lt)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>
</div>
</body>
</html>

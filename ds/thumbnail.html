<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>BlynAI Capital</title>
<link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;padding:0;width:1280px;height:854px;overflow:hidden}
.wrap{display:flex;width:1280px;height:854px}
.main{flex:1;display:grid;place-items:center;background:#050505;position:relative}
.main::after{content:"";position:absolute;inset:0;background:radial-gradient(620px 520px at 30% 20%,rgba(245,184,79,.14),transparent 70%),radial-gradient(620px 520px at 90% 95%,rgba(107,78,219,.20),transparent 70%)}
.lock{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:36px}
.lock img{width:300px;height:300px;display:block}
.lock b{font:600 96px/1 var(--font-display);letter-spacing:-.02em;color:#F7E6C1;white-space:nowrap}
.lock b i{font-style:normal;color:#F5B84F}
.strip{width:320px;display:flex;flex-direction:column}
.strip span{flex:1;display:block}
</style></head><body>
<div class="wrap">
<div class="main"><div class="lock"><img src="assets/logo-mark.svg" alt=""><b>Blyn<i>AI</i></b></div></div>
<div class="strip">
<span style="background:#FFD987"></span>
<span style="background:#A18AFF"></span>
<span style="background:#F5B84F"></span>
<span style="background:#6B4EDB"></span>
</div>
</div>
</body></html>

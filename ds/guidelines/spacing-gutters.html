<!-- @dsCard group="Spacing" viewport="700x190" name="Section gutters" subtitle="72px on paper, 34px on ink, 18px on mobile" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Gutters</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card);font:var(--type-body)}.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:52px;border-radius:var(--radius-xs);border:1px solid var(--border-hairline)}.n{font:10px/1.3 var(--font-mono);color:var(--text-meta);white-space:nowrap}.v{font:10px/1.3 var(--font-mono);color:var(--text-faint);white-space:nowrap}</style></head><body>
<div style="display:flex;flex-direction:column;gap:10px">
<div style="background:var(--paper-100);border:1px solid var(--border-hairline)"><div style="margin:0 72px;padding:14px 0;border-left:1px dashed var(--violet-700);border-right:1px dashed var(--violet-700)"><span class="n">--section-x 72px · --section-y 56px — light document pages</span></div></div>
<div style="background:var(--ink-900)"><div style="margin:0 34px;padding:14px 0;border-left:1px dashed var(--gold-400);border-right:1px dashed var(--gold-400)"><span class="n" style="color:var(--sand-200)">--section-x-ink 34px — dark lab pages</span></div></div>
<div style="background:var(--paper-050);border:1px solid var(--border-hairline);width:390px"><div style="margin:0 18px;padding:12px 0;border-left:1px dashed var(--violet-700);border-right:1px dashed var(--violet-700)"><span class="n">--mobile-x 18px · 390px</span></div></div>
</div></body></html>

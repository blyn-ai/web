<!-- @dsCard group="Effects" viewport="700x180" name="Shadows" subtitle="Three, and two of them belong to the logo plate" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Shadows</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card);font:var(--type-body)}.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:52px;border-radius:var(--radius-xs);border:1px solid var(--border-hairline)}.n{font:10px/1.3 var(--font-mono);color:var(--text-meta);white-space:nowrap}.v{font:10px/1.3 var(--font-mono);color:var(--text-faint);white-space:nowrap}</style></head><body>
<div class="row" style="gap:20px;align-items:stretch">
<div class="sw"><div style="width:150px;height:74px;background:var(--paper-000);border:1px solid var(--border-card);border-radius:var(--radius-sm);box-shadow:var(--shadow-card)"></div><span class="n">--shadow-card</span><span class="v">0 2px 10px rgba(0,0,0,.08)</span></div>
<div class="sw"><div style="width:150px;height:74px;background:var(--paper-000);border:1px solid var(--border-card);border-radius:var(--radius-sm);box-shadow:var(--shadow-violet-edge)"></div><span class="n">--shadow-violet-edge</span><span class="v">0 1px 0 rgba(107,78,219,.06)</span></div>
<div class="sw" style="padding:12px;background:var(--ink-900);border-radius:var(--radius-xs)"><div style="width:42px;height:42px;display:grid;place-items:center;border-radius:var(--radius-lg);background:rgba(0,0,0,.28);border:1px solid var(--border-gold);box-shadow:var(--shadow-mark)"><img src="../assets/logo-mark.svg" alt="" style="width:31px"></div><span class="n" style="color:var(--sand-200)">--shadow-mark</span></div>
<div class="sw" style="padding:12px;background:var(--ink-900);border-radius:var(--radius-xs)"><div style="width:64px;height:64px;display:grid;place-items:center;border-radius:var(--radius-3xl);background:var(--ink-800);border:1px solid rgba(245,184,79,.34);box-shadow:var(--shadow-mark-lg)"><img src="../assets/logo-mark.svg" alt="" style="width:46px"></div><span class="n" style="color:var(--sand-200)">--shadow-mark-lg</span></div>
</div></body></html>

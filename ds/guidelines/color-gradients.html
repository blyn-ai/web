<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Gradients</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card);font:var(--type-body)}.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:52px;border-radius:var(--radius-xs);border:1px solid var(--border-hairline)}.n{font:10px/1.3 var(--font-mono);color:var(--text-meta);white-space:nowrap}.v{font:10px/1.3 var(--font-mono);color:var(--text-faint);white-space:nowrap}</style></head><body>
<div style="display:flex;flex-direction:column;gap:14px">
<div><div style="height:6px;background:var(--gradient-rule)"></div><span class="n">--gradient-rule &nbsp; 90deg #F5B84F &rarr; #C98F63 42% &rarr; #8C6BC9 74% &rarr; #6B4EDB</span></div>
<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
<span style="font:400 30px var(--font-display);letter-spacing:-.02em;background:var(--gradient-text);-webkit-background-clip:text;background-clip:text;color:transparent">programa prekiauja</span><span class="n">--gradient-text</span>
</div>
<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
<span style="display:inline-flex;align-items:center;height:46px;padding:0 24px;border-radius:var(--radius-sm);background:var(--gradient-action);color:#fff;font:var(--type-button)">Gyvas žurnalas</span><span class="n">--gradient-action &nbsp; 96deg #8A6320 &rarr; #5B3FC4</span>
<div style="width:4px;height:46px;background:var(--gradient-divider-v)"></div><span class="n">--gradient-divider-v</span>
</div>
</div></body></html>

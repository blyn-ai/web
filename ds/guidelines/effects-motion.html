<!-- @dsCard group="Effects" viewport="700x150" name="States & motion" subtitle="120–180ms colour only; nothing scales, nothing bounces" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>States</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card);font:var(--type-body)}.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:52px;border-radius:var(--radius-xs);border:1px solid var(--border-hairline)}.n{font:10px/1.3 var(--font-mono);color:var(--text-meta);white-space:nowrap}.v{font:10px/1.3 var(--font-mono);color:var(--text-faint);white-space:nowrap}</style></head><body>
<div class="row" style="gap:14px;align-items:center">
<span style="display:inline-flex;align-items:center;height:46px;padding:0 24px;border-radius:var(--radius-sm);background:var(--gradient-action);color:#fff;font:var(--type-button)">rest</span>
<span style="display:inline-flex;align-items:center;height:46px;padding:0 24px;border-radius:var(--radius-sm);background:var(--gradient-action);filter:brightness(1.1);color:#fff;font:var(--type-button)">hover</span>
<span style="display:inline-flex;align-items:center;height:46px;padding:0 24px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);color:var(--text-heading);font:var(--type-button)">rest</span>
<span style="display:inline-flex;align-items:center;height:46px;padding:0 24px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:rgba(26,23,18,.05);color:var(--text-heading);font:var(--type-button)">hover</span>
<span style="display:inline-flex;align-items:center;height:46px;padding:0 24px;border-radius:var(--radius-sm);background:var(--gradient-action);opacity:.45;color:#fff;font:var(--type-button)">disabled</span>
</div>
<span class="n" style="display:block;margin-top:12px">--dur-fast 120ms · --dur 180ms · --ease cubic-bezier(.2,.6,.2,1) · colour and border only</span></body></html>

<!-- @dsCard group="Spacing" viewport="700x140" name="Control heights" subtitle="44 / 46 / 48px — 44px is the mobile tap floor" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Controls</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card);font:var(--type-body)}.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:52px;border-radius:var(--radius-xs);border:1px solid var(--border-hairline)}.n{font:10px/1.3 var(--font-mono);color:var(--text-meta);white-space:nowrap}.v{font:10px/1.3 var(--font-mono);color:var(--text-faint);white-space:nowrap}</style></head><body>
<div class="row" style="align-items:flex-end">
<div class="sw"><div style="display:flex;align-items:center;height:44px;padding:0 24px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);font:var(--type-button);color:var(--text-heading)">44px</div><span class="n">--control-h-sm</span></div><div class="sw"><div style="display:flex;align-items:center;height:46px;padding:0 24px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);font:var(--type-button);color:var(--text-heading)">46px</div><span class="n">--control-h</span></div><div class="sw"><div style="display:flex;align-items:center;height:48px;padding:0 24px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);font:var(--type-button);color:var(--text-heading)">48px</div><span class="n">--control-h-lg</span></div>
<div class="sw"><div style="width:42px;height:42px;border-radius:var(--radius-lg);border:1px solid var(--border-gold);background:var(--ink-800);box-shadow:var(--shadow-mark)"></div><span class="n">--mark-size 42</span></div>
</div></body></html>

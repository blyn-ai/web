<!-- @dsCard group="Effects" viewport="700x150" name="Corner radii" subtitle="6px on paper, 12–16px on ink, 3px for portrait plates" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card);font:var(--type-body)}.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:52px;border-radius:var(--radius-xs);border:1px solid var(--border-hairline)}.n{font:10px/1.3 var(--font-mono);color:var(--text-meta);white-space:nowrap}.v{font:10px/1.3 var(--font-mono);color:var(--text-faint);white-space:nowrap}</style></head><body>
<div class="row"><div class="sw"><div style="width:60px;height:52px;border:1px solid var(--border-strong);border-radius:3px;background:var(--paper-050)"></div><span class="n">--radius-hair</span><span class="v">3px</span></div><div class="sw"><div style="width:60px;height:52px;border:1px solid var(--border-strong);border-radius:4px;background:var(--paper-050)"></div><span class="n">--radius-xs</span><span class="v">4px</span></div><div class="sw"><div style="width:60px;height:52px;border:1px solid var(--border-strong);border-radius:6px;background:var(--paper-050)"></div><span class="n">--radius-sm</span><span class="v">6px</span></div><div class="sw"><div style="width:60px;height:52px;border:1px solid var(--border-strong);border-radius:10px;background:var(--paper-050)"></div><span class="n">--radius-md</span><span class="v">10px</span></div><div class="sw"><div style="width:60px;height:52px;border:1px solid var(--border-strong);border-radius:12px;background:var(--paper-050)"></div><span class="n">--radius-lg</span><span class="v">12px</span></div><div class="sw"><div style="width:60px;height:52px;border:1px solid var(--border-strong);border-radius:14px;background:var(--paper-050)"></div><span class="n">--radius-xl</span><span class="v">14px</span></div><div class="sw"><div style="width:60px;height:52px;border:1px solid var(--border-strong);border-radius:16px;background:var(--paper-050)"></div><span class="n">--radius-2xl</span><span class="v">16px</span></div><div class="sw"><div style="width:60px;height:52px;border:1px solid var(--border-strong);border-radius:18px;background:var(--paper-050)"></div><span class="n">--radius-3xl</span><span class="v">18px</span></div></div></body></html>

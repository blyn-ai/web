<!-- @dsCard group="Brand" viewport="700x160" name="Mark" subtitle="Two chevrons, a 2x2 dot ledger, always plated on ink" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Mark</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card);font:var(--type-body)}.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:52px;border-radius:var(--radius-xs);border:1px solid var(--border-hairline)}.n{font:10px/1.3 var(--font-mono);color:var(--text-meta);white-space:nowrap}.v{font:10px/1.3 var(--font-mono);color:var(--text-faint);white-space:nowrap}</style></head><body>
<div class="row" style="gap:22px;align-items:flex-end;padding:14px;background:var(--ink-900);border-radius:var(--radius-xs)">
<div class="sw"><div style="width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid rgba(245,184,79,.28);box-shadow:var(--shadow-mark)"><img src="../assets/logo-mark.svg" alt="" style="width:26px"></div><span class="n" style="color:var(--sand-200)">sm · 36px</span></div><div class="sw"><div style="width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid rgba(245,184,79,.28);box-shadow:var(--shadow-mark)"><img src="../assets/logo-mark.svg" alt="" style="width:31px"></div><span class="n" style="color:var(--sand-200)">md · 42px</span></div><div class="sw"><div style="width:64px;height:64px;display:grid;place-items:center;border-radius:18px;background:#0A0A0A;border:1px solid rgba(245,184,79,.34);box-shadow:var(--shadow-mark-lg)"><img src="../assets/logo-mark.svg" alt="" style="width:46px"></div><span class="n" style="color:var(--sand-200)">lg · 64px</span></div>
<div class="sw"><img src="../assets/logo-avatar-512.svg" alt="" style="width:64px;height:64px;border-radius:var(--radius-lg)"><span class="n" style="color:var(--sand-200)">avatar 512</span></div>
<div class="sw" style="padding:8px;background:var(--paper-000);border-radius:var(--radius-xs)"><img src="../assets/logo-mark-mono.svg" alt="" style="width:40px;color:var(--ink-600)"><span class="n">mono</span></div>
</div></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Member marks</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card);font:var(--type-body)}.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:52px;border-radius:var(--radius-xs);border:1px solid var(--border-hairline)}.n{font:10px/1.3 var(--font-mono);color:var(--text-meta);white-space:nowrap}.v{font:10px/1.3 var(--font-mono);color:var(--text-faint);white-space:nowrap}</style></head><body>
<div class="row" style="gap:26px">
<div style="display:flex;align-items:center;gap:14px"><img src="../assets/coin-luko.svg" alt="LUKO" style="width:56px;height:56px"><div><b style="display:block;font:600 15px var(--font-display);letter-spacing:.02em;color:var(--luko-label)">LUKO</b><span class="n">--luko-coin #C9A86A</span><br><span class="v">--luko-label #8A6320</span></div></div>
<div style="display:flex;align-items:center;gap:14px"><img src="../assets/coin-byko.svg" alt="BYKO" style="width:56px;height:56px"><div><b style="display:block;font:600 15px var(--font-display);letter-spacing:.02em;color:var(--byko-label)">BYKO</b><span class="n">--byko-coin #7CCBFF</span><br><span class="v">--byko-label #2E5F94</span></div></div>
</div></body></html>

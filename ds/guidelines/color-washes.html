<!-- @dsCard group="Colors" viewport="700x180" name="Field washes" subtitle="Always paired: gold north-west, violet south-east" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Washes</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card);font:var(--type-body)}.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:52px;border-radius:var(--radius-xs);border:1px solid var(--border-hairline)}.n{font:10px/1.3 var(--font-mono);color:var(--text-meta);white-space:nowrap}.v{font:10px/1.3 var(--font-mono);color:var(--text-faint);white-space:nowrap}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div style="height:120px;border:1px solid var(--border-hairline);border-radius:var(--radius-xs);background:var(--wash-gold),var(--wash-violet),var(--paper-050);display:flex;align-items:flex-end;padding:10px"><span class="n">--wash-gold + --wash-violet on --paper-050</span></div>
<div style="height:120px;border-radius:var(--radius-xs);background:var(--wash-gold-ink),var(--wash-violet-ink),var(--ink-850);display:flex;align-items:flex-end;padding:10px"><span class="n" style="color:var(--sand-400)">--wash-gold-ink + --wash-violet-ink on --ink-850</span></div>
</div></body></html>

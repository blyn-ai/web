<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Rules</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card);font:var(--type-body)}.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:52px;border-radius:var(--radius-xs);border:1px solid var(--border-hairline)}.n{font:10px/1.3 var(--font-mono);color:var(--text-meta);white-space:nowrap}.v{font:10px/1.3 var(--font-mono);color:var(--text-faint);white-space:nowrap}</style></head><body>
<div style="display:flex;flex-direction:column;gap:16px">
<div><div style="height:6px;background:var(--gradient-rule)"></div><span class="n">--gradient-rule 6px — brand band, once per surface</span></div>
<div><div style="height:2px;background:var(--border-rule)"></div><span class="n">--rule-strong 2px solid --ink-600 — above the BLYN / AI split</span></div>
<div><div style="height:1px;background:var(--border-hairline)"></div><span class="n">--border-hairline rgba(26,23,18,.14) — between sections and rows</span></div>
<div style="padding:10px 0;background:var(--ink-900)"><div style="height:1px;background:var(--border-hairline-on-ink)"></div><span class="n" style="color:var(--sand-400)">--border-hairline-on-ink rgba(246,218,160,.12)</span></div>
</div></body></html>

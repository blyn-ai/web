<!-- @dsCard group="Brand" viewport="700x180" name="Lockup" subtitle="Mark, name with gold AI, mono descriptor — on ink and on paper" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Lockup</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-card);font:var(--type-body)}.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:52px;border-radius:var(--radius-xs);border:1px solid var(--border-hairline)}.n{font:10px/1.3 var(--font-mono);color:var(--text-meta);white-space:nowrap}.v{font:10px/1.3 var(--font-mono);color:var(--text-faint);white-space:nowrap}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div style="display:flex;align-items:center;gap:12px;padding:18px;background:var(--ink-900);border-radius:var(--radius-xs)">
<span style="width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--border-gold);box-shadow:var(--shadow-mark)"><img src="../assets/logo-mark.svg" alt="" style="width:31px"></span>
<span style="display:flex;flex-direction:column;gap:2px"><b style="font:600 17px/1.05 var(--font-display);letter-spacing:.01em;color:var(--gold-200)">Blyn<i style="font-style:normal;color:var(--gold-400)">AI</i> Capital</b><small style="font:10px var(--font-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--violet-400)">L&amp;D Finance Lab</small></span>
</div>
<div style="display:flex;align-items:center;gap:18px;padding:18px;background:var(--paper-050);border:1px solid var(--border-hairline);border-radius:var(--radius-xs)">
<span style="width:64px;height:64px;display:grid;place-items:center;border-radius:18px;background:var(--ink-800);border:1px solid rgba(245,184,79,.34);box-shadow:var(--shadow-mark-lg)"><img src="../assets/logo-mark.svg" alt="" style="width:46px"></span>
<span style="display:flex;flex-direction:column;gap:5px"><b style="font:600 27px/1 var(--font-display);color:var(--text-heading)">Blyn<i style="font-style:normal;color:var(--gold-700)">AI</i> Capital</b><small style="font:13px var(--font-mono);text-transform:uppercase;letter-spacing:.18em;color:var(--violet-700)">L&amp;D Finance Lab</small></span>
</div>
</div>
<span class="n" style="display:block;margin-top:10px">Legal name in prose is always MB „BlynAI“. Trade name in lockups is BlynAI Capital.</span></body></html>

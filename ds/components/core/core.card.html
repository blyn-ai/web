<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Core</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:0;padding:18px 20px;background:var(--surface-card)}.lbl{font:10px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin:0 0 8px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
if (!window.BlynAICapitalDesignSystem_090ef4) { document.getElementById('root').innerHTML = '<p style="font:13px/1.8 \'IBM Plex Mono\',monospace;color:#8A8175">_ds_bundle.js nepasiekiamas — perkraukite puslapį.</p>'; }
const { Button, Eyebrow, Badge, Card } = window.BlynAICapitalDesignSystem_090ef4;
function Demo(){return (
<div style={{display:'flex',flexDirection:'column',gap:16}}>
  <div><p className="lbl">Button — on paper</p>
    <div style={{display:'flex',flexWrap:'wrap',gap:12,alignItems:'center'}}>
      <Button variant="gradient" href="#">Gyvas žurnalas</Button>
      <Button variant="outline" href="#">GitHub · atvirasis kodas</Button>
      <Button variant="pill" size="lg" href="#">Tyrimų programa</Button>
      <Button variant="gradient" disabled href="#">Netaikoma</Button>
    </div>
  </div>
  <div style={{padding:'14px 16px',background:'var(--ink-900)',borderRadius:4}}><p className="lbl">Button — on ink</p>
    <div style={{display:'flex',flexWrap:'wrap',gap:12,alignItems:'center'}}>
      <Button variant="gold" size="sm" href="#">Gyvas žurnalas</Button>
      <Button variant="outlineInk" size="sm" href="#">Tyrimų programa</Button>
      <Button variant="pillViolet" href="#">GitHub</Button>
    </div>
  </div>
  <div style={{display:'flex',gap:26,alignItems:'flex-start',flexWrap:'wrap'}}>
    <div><p className="lbl">Eyebrow</p><Eyebrow>Tyrimų kryptys</Eyebrow><div style={{height:6}}/><Eyebrow tone="lilac">Du nariai, dvi valiutos</Eyebrow><div style={{height:6}}/><Eyebrow size="sm" tone="muted">Registro duomenys</Eyebrow></div>
    <div><p className="lbl">Badge</p><div style={{display:'flex',gap:8}}><Badge>gyvas</Badge><Badge tone="gold">savos lėšos</Badge><Badge tone="violet">registruojama</Badge><Badge tone="ink">v2</Badge></div></div>
  </div>
  <div><p className="lbl">Card — paper / raised / tinted / ink / glass</p>
    <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:10}}>
      <Card padding={14}><b style={{font:'500 13px var(--font-display)'}}>paper</b></Card>
      <Card tone="raised" padding={14}><b style={{font:'500 13px var(--font-display)'}}>raised</b></Card>
      <Card tint="gold" padding={14}><b style={{font:'500 13px var(--font-display)'}}>tint gold</b></Card>
      <Card tone="ink" padding={14}><b style={{font:'500 13px var(--font-display)',color:'var(--gold-200)'}}>ink</b></Card>
      <Card tone="glass" padding={14} style={{background:'var(--ink-760)'}}><b style={{font:'500 13px var(--font-display)',color:'var(--lilac-100)'}}>glass</b></Card>
    </div>
  </div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>

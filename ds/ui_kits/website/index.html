<!-- @dsCard group="Website" viewport="1240x820" name="blynai.eu — home page, four variants" subtitle="Dokumentas · Laboratorija · Plakatas · Žurnalas, desktop and 390px" -->
<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blynai.eu — pradinio puslapio variantai</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="content.js"></script>
<style>
body{margin:0;background:var(--paper-200)}
.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 22px;background:var(--ink-900);border-bottom:1px solid rgba(246,218,160,.14)}
.grp{display:flex;gap:6px;align-items:center}
.tab{appearance:none;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border:1px solid rgba(246,218,160,.18);border-radius:var(--radius-sm);background:transparent;color:var(--sand-200);font:600 11px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:var(--transition-color)}
.tab:hover{color:var(--gold-200);border-color:rgba(246,218,160,.34)}
.tab[aria-pressed="true"]{background:var(--gold-400);border-color:var(--gold-400);color:#151006}
.tab i{font-style:normal;opacity:.6}
.tab[aria-pressed="true"] i{opacity:.75}
.meta{flex:1 1 auto;min-width:0;margin:0;font:11px/1.5 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--sand-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{display:flex;justify-content:center;padding:26px 22px 60px}
.fitter{position:relative;flex:none}
.frame{transform-origin:top left;background:var(--paper-000);border:1px solid rgba(0,0,0,.12);border-radius:var(--radius-md);box-shadow:0 8px 34px rgba(0,0,0,.14);overflow:hidden}
a{color:var(--link)}a:hover{color:var(--link-hover)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="HomeDocument.jsx"></script>
<script type="text/babel" src="HomeLab.jsx"></script>
<script type="text/babel" src="HomePoster.jsx"></script>
<script type="text/babel" src="HomeLedger.jsx"></script>
<script type="text/babel">
const VARIANTS = [
  { id: 'document', label: 'Dokumentas', note: 'Šviesus · akademinis', get: () => window.HomeDocument },
  { id: 'lab',      label: 'Laboratorija', note: 'Tamsus · boto konsolė', get: () => window.HomeLab },
  { id: 'poster',   label: 'Plakatas', note: 'Violetinis · plakatas', get: () => window.HomePoster },
  { id: 'ledger',   label: 'Žurnalas', note: 'Patvirtinta · pelno kreivė herojuje', get: () => window.HomeLedger }
];

function useReady(names) {
  const [ready, setReady] = React.useState(() => names.every(n => window[n]));
  React.useEffect(() => {
    if (ready) return;
    const t = setInterval(() => { if (names.every(n => window[n])) { setReady(true); clearInterval(t); } }, 120);
    return () => clearInterval(t);
  }, [ready]);
  return ready;
}

/* The frame always renders at its true design width; we scale it to fit the window so
   the "1160 px" label stays honest. Origin top-left, and the wrapper takes the scaled
   box so nothing is left dangling below. */
function useFitter(designWidth, key) {
  const stage = React.useRef(null);
  const frame = React.useRef(null);
  const [box, setBox] = React.useState({ k: 1, h: 0 });
  React.useLayoutEffect(() => {
    const measure = () => {
      if (!stage.current || !frame.current) return;
      const avail = stage.current.clientWidth - 44;
      const k = Math.min(1, avail / designWidth);
      setBox({ k, h: frame.current.scrollHeight });
    };
    measure();
    const ro = new ResizeObserver(() => requestAnimationFrame(measure));
    if (stage.current) ro.observe(stage.current);
    if (frame.current) ro.observe(frame.current);
    return () => ro.disconnect();
  }, [designWidth, key]);
  return { stage, frame, k: box.k, h: box.h };
}

function Diag() {
  const missing = ['BlynAICapitalDesignSystem_090ef4', 'BLYN', 'HomeDocument', 'HomeLab', 'HomePoster', 'HomeLedger'].filter(n => !window[n]);
  return (
    <div style={{ padding: 40, font: '13px/1.8 "IBM Plex Mono",monospace', color: '#4A423A' }}>
      <p style={{ margin: 0, color: '#8A6320' }}>Kraunama…</p>
      {missing.length > 0 && (
        <p style={{ margin: '14px 0 0', color: '#6B4EDB' }}>
          Nepasiekiama: {missing.join(', ')}
          <br /><span style={{ color: '#8A8175' }}>_ds_bundle.js sukompiliuojamas dizaino sistemos projekte — perkraukite puslapį.</span>
        </p>
      )}
    </div>
  );
}

function App() {
  const ready = useReady(['BlynAICapitalDesignSystem_090ef4', 'BLYN', 'HomeDocument', 'HomeLab', 'HomePoster', 'HomeLedger']);
  const [variant, setVariant] = React.useState(() => localStorage.getItem('blynai.variant') || 'ledger');
  const [narrow, setNarrow] = React.useState(() => localStorage.getItem('blynai.narrow') === '1');
  React.useEffect(() => { localStorage.setItem('blynai.variant', variant); }, [variant]);
  React.useEffect(() => { localStorage.setItem('blynai.narrow', narrow ? '1' : '0'); }, [narrow]);
  const active = VARIANTS.find(v => v.id === variant) || VARIANTS[0];
  const design = narrow ? 390 : 1160;
  const fit = useFitter(design, variant);
  const Screen = ready ? active.get() : null;
  return (
    <div>
      <div className="bar">
        <div className="grp">
          {VARIANTS.map((v, i) => (
            <button key={v.id} type="button" className="tab" aria-pressed={v.id === variant} onClick={() => setVariant(v.id)}>
              <i>{String(i + 1).padStart(2, '0')}</i>{v.label}
            </button>
          ))}
        </div>
        <p className="meta">{active.note}</p>
        <div className="grp">
          <button type="button" className="tab" aria-pressed={!narrow} onClick={() => setNarrow(false)}>1160 px</button>
          <button type="button" className="tab" aria-pressed={narrow} onClick={() => setNarrow(true)}>390 px</button>
        </div>
      </div>
      <div className="stage" ref={fit.stage}>
        <div className="fitter" style={{ width: design * fit.k, height: fit.h ? fit.h * fit.k : undefined }}>
          <div className="frame" ref={fit.frame} style={{ width: design, transform: 'scale(' + fit.k + ')' }}>
            {Screen ? <Screen narrow={narrow} /> : <Diag />}
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

<!-- @dsCard group="Social" viewport="1240x760" name="Share cards — 1200×630" subtitle="Four OG layouts, each shown in a real Messenger bubble" -->
<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>BlynAI — dalinimosi kortelės</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../website/content.js"></script>
<style>
body{margin:0;padding:26px 22px 60px;background:var(--paper-200)}
.hd{display:flex;align-items:baseline;gap:12px;margin:0 0 10px}
.hd b{font:600 13px var(--font-display);color:var(--text-heading)}
.hd span{font:11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-meta)}
.row{display:flex;gap:26px;align-items:flex-start;margin-bottom:34px}
.card{flex:none;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.08);overflow:hidden}
.fb{width:390px}
.fb-top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #E9E9EC}
.fb-back{font:18px/1 sans-serif;color:#0A7CFF}
.fb-av{width:32px;height:32px;flex:none;border-radius:50%;background:#D8DBE0}
.fb-top b{font:600 14px var(--font-body);color:#111}
.fb-body{display:flex;flex-direction:column;gap:8px;padding:16px 16px 20px;background:#fff}
.fb-me{align-self:flex-end;max-width:250px;padding:9px 14px;border-radius:18px;background:#0A7CFF;color:#fff;font-size:14px;line-height:1.35}
.fb-link{align-self:flex-end;width:328px;border-radius:18px;overflow:hidden;background:#F1F2F4;border:1px solid #E4E6EA}
.fb-shot{width:328px;height:172px;overflow:hidden}
.fb-shot>div{zoom:.27333}
.fb-meta{padding:10px 14px 12px}
.fb-meta p{margin:0}
.fb-dom{font:11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:#65676B}
.fb-tit{margin-top:3px;font:600 13.5px/1.35 var(--font-body);color:#050505}
.fb-seen{align-self:flex-end;margin:2px 4px 0;font:11px var(--font-body);color:#8A8D91}
a{color:var(--link)}a:hover{color:var(--link-hover)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="OGCard.jsx"></script>
<script type="text/babel">
const CARDS = [
  { id: 'sentence', name: 'Sakinys', note: 'numatytoji · veiklos aprašymas', get: () => window.OGSentence },
  { id: 'name', name: 'Vardas', note: 'BLYN / AI iššifravimas', get: () => window.OGName },
  { id: 'dark', name: 'Tamsus', note: 'žurnalui ir boto įrašams', get: () => window.OGDark },
  { id: 'coins', name: 'Monetos', note: 'apie konkrečią instanciją', get: () => window.OGCoins }
];

function Bubble({ children }) {
  return (
    <div className="card fb">
      <div className="fb-top"><span className="fb-back">‹</span><span className="fb-av"></span><b>Lukas</b></div>
      <div className="fb-body">
        <div className="fb-me">Įmonės puslapis gyvas</div>
        <div className="fb-link">
          <div className="fb-shot">{children}</div>
          <div className="fb-meta"><p className="fb-dom">blynai.eu</p><p className="fb-tit">MB „BlynAI“ — algoritminės prekybos tyrimų bendrija</p></div>
        </div>
        <p className="fb-seen">Perskaityta 14:32</p>
      </div>
    </div>
  );
}

function App() {
  const names = ['BlynAICapitalDesignSystem_090ef4', 'BLYN', 'OGSentence', 'OGName', 'OGDark', 'OGCoins'];
  const [ready, setReady] = React.useState(() => names.every(n => window[n]));
  React.useEffect(() => {
    if (ready) return;
    const t = setInterval(() => { if (names.every(n => window[n])) { setReady(true); clearInterval(t); } }, 120);
    return () => clearInterval(t);
  }, [ready]);
  if (!ready) return (
    <p style={{ font: '13px/1.8 "IBM Plex Mono",monospace', color: '#4A423A' }}>
      Kraunama…<br />
      <span style={{ color: '#8A8175' }}>Nepasiekiama: {names.filter(n => !window[n]).join(', ') || '—'}</span>
    </p>
  );
  return (
    <div>
      {CARDS.map(c => {
        const Card = c.get();
        if (!Card) return null;
        return (
          <div key={c.id}>
            <p className="hd"><b>{c.name}</b><span>{c.note}</span></p>
            <div className="row">
              <div className="card"><Card /></div>
              <Bubble><Card /></Bubble>
            </div>
          </div>
        );
      })}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
